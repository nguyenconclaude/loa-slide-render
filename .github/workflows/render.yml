name: Render slides

on:
  push:
    branches: [main]
    paths:
      - 'decks/**.md'
      - 'themes/**'
      - 'layouts/**'
      - 'public/**'
      - 'style.css'
      - 'package.json'
      - '.github/workflows/render.yml'
  workflow_dispatch:
    inputs:
      deck:
        description: 'Deck file (e.g. decks/pansy.md)'
        required: false
        default: ''

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Detect changed decks
        id: decks
        run: |
          if [ -n "${{ github.event.inputs.deck }}" ]; then
            echo "files=${{ github.event.inputs.deck }}" >> $GITHUB_OUTPUT
          else
            CHANGED=$(git diff --name-only HEAD^ HEAD -- 'decks/*.md' 2>/dev/null | tr '\n' ' ')
            if [ -z "$CHANGED" ]; then
              CHANGED=$(ls decks/*.md 2>/dev/null | tr '\n' ' ')
            fi
            echo "files=$CHANGED" >> $GITHUB_OUTPUT
          fi
          echo "Will render: $CHANGED"

      - name: Render decks to PNG
        run: |
          mkdir -p dist
          for deck in ${{ steps.decks.outputs.files }}; do
            [ -f "$deck" ] || continue
            slug=$(basename "$deck" .md)
            echo "::group::Render $slug"
            # Stage deck in isolated workdir with shared layouts + style
            workdir=$(mktemp -d)
            cp "$deck" "$workdir/slides.md"
            cp -r layouts "$workdir/" 2>/dev/null || true
            cp -r public "$workdir/" 2>/dev/null || true
            cp style.css "$workdir/" 2>/dev/null || true
            cp package.json "$workdir/"
            ln -s "$GITHUB_WORKSPACE/node_modules" "$workdir/node_modules"
            (cd "$workdir" && "$GITHUB_WORKSPACE/node_modules/.bin/slidev" export slides.md --format png --output ./out/ 2>&1 | tee /tmp/slidev-$slug.log) || true
            echo "::group::slidev log $slug"; cat /tmp/slidev-$slug.log 2>/dev/null | tail -30; echo "::endgroup::"
            mkdir -p "dist/$slug/9-16" "dist/$slug/4-5" "dist/$slug/1-1"
            for src in "$workdir"/out/*.png; do
              [ -f "$src" ] || continue
              base=$(basename "$src")
              cp "$src" "dist/$slug/9-16/$base"
              # 9:16 (2160x3840 retina) → crop center 4:5 (2160x2700)
              convert "$src" -gravity center -crop 2160x2700+0+0 +repage "dist/$slug/4-5/$base"
              # 9:16 → crop center 1:1 (2160x2160)
              convert "$src" -gravity center -crop 2160x2160+0+0 +repage "dist/$slug/1-1/$base"
            done
            rm -rf "$workdir"
            ls -la "dist/$slug"/*/ || true
            echo "::endgroup::"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: slides-png-${{ github.run_id }}
          path: dist/
          retention-days: 7

      - name: Create release with PNG assets
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="render-${{ github.run_number }}"
          gh release create "$TAG" \
            --title "Render run #${{ github.run_number }}" \
            --notes "Auto-rendered from commit ${{ github.sha }}" \
            --target ${{ github.sha }} || true
          for f in $(find dist -type f -name '*.png'); do
            gh release upload "$TAG" "$f" --clobber || true
          done
